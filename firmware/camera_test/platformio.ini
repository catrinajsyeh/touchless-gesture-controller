; Camera-only check. No gesture model and no Bluetooth.
; The board becomes a Wi-Fi hotspot and serves the live picture.

[env:camera_test]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
upload_speed = 460800
monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
