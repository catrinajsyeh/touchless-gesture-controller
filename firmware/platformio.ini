; Freenove ESP32-S3-WROOM (FNK0085 family).
; Flash is set to 8MB so the same image boots on both N8R8 and N16R8.
; PSRAM is octal (OPI), which this board needs for the camera frame buffer.
; Default env uses the CH343 UART USB port. Use freenove_esp32s3_usb for the native USB-C port.

[platformio]
src_dir = src

[env:freenove_esp32s3_uart]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_upload.maximum_size = 4194304
upload_speed = 460800
monitor_speed = 921600
build_type = release
build_flags =
  -I src
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DTOUCHLESS_USB_CDC=0

[env:freenove_esp32s3_usb]
extends = env:freenove_esp32s3_uart
build_flags =
  -I src
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DTOUCHLESS_USB_CDC=1
upload_flags =
  --before=default_reset
  --after=hard_reset
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
