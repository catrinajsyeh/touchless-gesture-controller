<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Touchless training</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="top">
      <div>
        <p class="eyebrow">Touchless</p>
        <h1 id="title">Train the gestures</h1>
      </div>
      <nav class="tabs" aria-label="Sections">
        <button type="button" id="tabTrain" class="tab is-on">Train</button>
        <button type="button" id="tabCheck" class="tab">Check</button>
      </nav>
    </header>

    <p class="status" id="linkStatus">Looking for the board…</p>

    <div class="stage">
      <div class="preview-wrap">
        <img id="photo" alt="Camera view">
        <p class="countdown" id="countdown" hidden>3</p>
        <p class="empty" id="empty">Waiting for a picture from the board.</p>
        <p class="seen" id="seen">Looking for a hand…</p>
      </div>

      <aside class="side">
        <section id="trainPane">
          <p class="choose">Green pose gets saved.</p>
          <div class="poses" id="poses"></div>
          <div class="actions">
            <button type="button" id="save" class="primary">Save 10 photos of Index up</button>
            <button type="button" id="train">Train model</button>
          </div>
          <p class="message" id="trainMsg"></p>
        </section>

        <section id="checkPane" hidden>
          <p class="guess" id="guess">—</p>
          <p class="confidence" id="confidence"></p>
          <ul class="scores" id="scores"></ul>
          <p class="help" id="checkNote">Hold the pose, drop your hand, then hold it again. A key is sent only on this tab when Touchless Keys is connected.</p>
        </section>
      </aside>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
